<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folder Access - Mr Affection</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#121212;border:1px solid #333;width:100%;max-width:400px;padding:25px;border-radius:20px}
input,select{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #333;background:#1f1f1f;color:#fff;outline:none}
button{width:100%;padding:14px;margin-top:15px;border-radius:12px;border:none;background:#ff2e63;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
#ok{display:none;text-align:center;font-size:18px;font-weight:bold;color:#ff2e63;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<form id="form">
<input id="name" placeholder="Your Name" required>
<div style="display:flex;gap:8px">
<input id="country" value="+509" style="width:90px" required>
<input id="number" placeholder="Phone Number" type="tel" required>
</div>
<select id="gender" required>
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
<button type="submit">Join Folder</button>
</form>
<div id="ok">ᴍʀ. ᴀғғᴇᴄᴛɪᴏɴ࿐❤️ resevwa demand ou an e ou fè pati de folder a Merci!</div>
</div>

<script>
// YOUR SUPABASE INFO
const SUPABASE_URL = "https://pzdrwczfampybkjcmwqp.supabase.co";
const SUPABASE_KEY = "sb_publishable_LEd8bVkXvcuyXn8q8LojwQ_mJur5TNL";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("form").addEventListener("submit", async (e)=>{
e.preventDefault();
const btn = e.target.querySelector("button");
btn.innerText = "Sending...";
btn.disabled = true;

const { error } = await client.from("folder_contacts").insert([{
Name: document.getElementById("name").value.trim(),
Number: document.getElementById("number").value.trim(),
Country: document.getElementById("country").value.trim(),
Gender: document.getElementById("gender").value
}]);

if(error){
  alert("Error: " + error.message);
  btn.innerText = "Join Folder";
  btn.disabled = false;
} else {
  document.getElementById("form").style.display="none";
  document.getElementById("ok").style.display="block";
}
});
</script>
</body>
</html>
